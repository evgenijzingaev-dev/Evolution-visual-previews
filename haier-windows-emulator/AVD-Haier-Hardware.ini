# Haier LE43K6500SA profile for Android Emulator (not firmware)
# Real hardware: Realtek RTD2841 / quad Cortex-A53 / Mali-450 MP2
# Emulator uses host-accelerated x86 instead of exact RTD2841 emulation
hw.cpu.ncore=4
hw.ramSize=1024
vm.heapSize=128
hw.lcd.width=1920
hw.lcd.height=1080
hw.lcd.density=160
disk.dataPartition.size=6G
hw.gpu.enabled=yes
hw.gpu.mode=auto
hw.keyboard=yes
hw.dPad=yes
hw.mainKeys=yes
hw.camera.back=none
hw.camera.front=none
