name: Zona Web Lite - APK only
on:
  push:
    branches: [zona-web-lite-haier]
    paths:
      - "zona-web-lite/**"
      - ".github/workflows/zona-web-lite-build.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Compile APK
        working-directory: zona-web-lite
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zona-Web-Lite-Haier-APK-only
          path: zona-web-lite/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
