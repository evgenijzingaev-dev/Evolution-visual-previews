name: Zona Web Lite - build and Android 7 test
on:
  push:
    branches: [zona-web-lite-haier]
    paths:
      - "zona-web-lite/**"
      - ".github/workflows/zona-web-lite.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compile Zona Web Lite Android 7 APK
        working-directory: zona-web-lite
        run: gradle :app:assembleDebug --no-daemon
      - name: Boot Android 7.1.1, test launch and capture memory
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 25
          target: google_apis
          arch: x86
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash zona-web-lite/ci/test.sh
      - name: Attach APK and real emulator screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Zona-Web-Lite-Haier-APK
          path: |
            zona-web-lite/app/build/outputs/apk/debug/app-debug.apk
            zona-web-lite/screenshots/*
          if-no-files-found: warn
