name: LiteHome Haier - Android 7.1 emulator
on:
  push:
    branches: [litehome-haier-emulator]
    paths:
      - "litehome-haier/**"
      - ".github/workflows/litehome-haier-emulator.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Compile native APK
        working-directory: litehome-haier/android
        run: gradle :app:assembleDebug --no-daemon
      - name: Launch Android 7.1.1 and take real screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 25
          target: google_apis
          arch: x86
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash litehome-haier/ci/capture.sh
      - name: Upload screenshots and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LiteHome-Haier-Android-7.1-captures
          path: |
            litehome-haier/screenshots/*.png
            litehome-haier/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
